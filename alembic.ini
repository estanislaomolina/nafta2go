# Configuración de Alembic. La URL de la base se toma de DATABASE_URL
# (ver nafta2go/persistence/database.py); no se escribe acá.
[alembic]
script_location = %(here)s/migrations
# Permite importar el paquete nafta2go al correr `alembic` desde la raíz.
prepend_sys_path = %(here)s
path_separator = os

# Logging del comando alembic (no se aplica cuando las migraciones se corren
# desde el código, para no pisar la configuración de la aplicación o de pytest).
[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
