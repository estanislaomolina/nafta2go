# Configuración de Alembic. La URL de la base se toma de DATABASE_URL
# (ver nafta2go/persistence/database.py); no se escribe acá.
[alembic]
script_location = %(here)s/migrations
# Permite importar el paquete nafta2go al correr `alembic` desde la raíz.
prepend_sys_path = %(here)s
path_separator = os
