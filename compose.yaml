# Servicios locales de Nafta2Go. Uso: docker compose up --build
# La base es un SQLite dentro del volumen nafta2go-data (ver ADR-005).
services:
  migrate:
    build: .
    image: nafta2go:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: sqlite:////app/data/nafta2go.db
    volumes:
      - nafta2go-data:/app/data
    restart: "no"

  query:
    image: nafta2go:local
    build: .
    profiles: [poc]
    entrypoint: ["python", "-m", "nafta2go.query"]
    environment:
      DATABASE_URL: sqlite:////app/data/nafta2go.db
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_CACHE_TTL_SECONDS: ${ORS_CACHE_TTL_SECONDS:-300}
      ORS_CACHE_MAX_ENTRIES: ${ORS_CACHE_MAX_ENTRIES:-128}
      ORS_REQUESTS_PER_MINUTE: ${ORS_REQUESTS_PER_MINUTE:-30}
      ORS_REQUESTS_PER_DAY: ${ORS_REQUESTS_PER_DAY:-450}
    volumes:
      - nafta2go-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: nafta2go:local
    build: .
    profiles: [mvp]
    command: ["uvicorn", "nafta2go.presentation.http:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--log-config", "deploy/logging.json"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://127.0.0.1:8000/ready', timeout=2); r.raise_for_status()"]
      interval: 2s
      timeout: 3s
      retries: 10
    environment:
      DATABASE_URL: sqlite:////app/data/nafta2go.db
      ORS_API_KEY: ${ORS_API_KEY:-}
      ORS_CACHE_TTL_SECONDS: ${ORS_CACHE_TTL_SECONDS:-300}
      ORS_CACHE_MAX_ENTRIES: ${ORS_CACHE_MAX_ENTRIES:-128}
      ORS_REQUESTS_PER_MINUTE: ${ORS_REQUESTS_PER_MINUTE:-30}
      ORS_REQUESTS_PER_DAY: ${ORS_REQUESTS_PER_DAY:-450}
      NAFTA2GO_API_TOKEN: ${NAFTA2GO_API_TOKEN:-}
    volumes:
      - nafta2go-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  nafta2go-data:
