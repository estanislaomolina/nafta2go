# Servicios locales de Nafta2Go. Uso: docker compose up --build
# La base es un SQLite dentro del volumen nafta2go-data (ver ADR-005).
services:
  migrate:
    build: .
    image: ${NAFTA2GO_IMAGE:-nafta2go:local}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: sqlite:////app/data/nafta2go.db
    volumes:
      - nafta2go-data:/app/data
    restart: "no"

  query:
    image: ${NAFTA2GO_IMAGE:-nafta2go:local}
    build: .
    profiles: [poc]
    entrypoint: ["python", "-m", "nafta2go.query"]
    environment:
      DATABASE_URL: sqlite:////app/data/nafta2go.db
      ORS_API_KEY: ${ORS_API_KEY:-}
      NAFTA2GO_MAX_PRICE_AGE_DAYS: ${NAFTA2GO_MAX_PRICE_AGE_DAYS-30}
      ORS_CACHE_TTL_SECONDS: ${ORS_CACHE_TTL_SECONDS:-300}
      ORS_CACHE_MAX_ENTRIES: ${ORS_CACHE_MAX_ENTRIES:-128}
      ORS_REQUESTS_PER_MINUTE: ${ORS_REQUESTS_PER_MINUTE:-30}
      ORS_REQUESTS_PER_DAY: ${ORS_REQUESTS_PER_DAY:-450}
    volumes:
      - nafta2go-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    image: ${NAFTA2GO_IMAGE:-nafta2go:local}
    build: .
    profiles: [mvp]
    command: ["uvicorn", "nafta2go.presentation.http:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--log-config", "deploy/logging.json"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r=requests.get('http://127.0.0.1:8000/ready', timeout=2); r.raise_for_status()"]
      interval: 2s
      timeout: 3s
      retries: 10
    environment:
      DATABASE_URL: sqlite:////app/data/nafta2go.db
      ORS_API_KEY: ${ORS_API_KEY:-}
      NAFTA2GO_MAX_PRICE_AGE_DAYS: ${NAFTA2GO_MAX_PRICE_AGE_DAYS-30}
      ORS_CACHE_TTL_SECONDS: ${ORS_CACHE_TTL_SECONDS:-300}
      ORS_CACHE_MAX_ENTRIES: ${ORS_CACHE_MAX_ENTRIES:-128}
      ORS_REQUESTS_PER_MINUTE: ${ORS_REQUESTS_PER_MINUTE:-30}
      ORS_REQUESTS_PER_DAY: ${ORS_REQUESTS_PER_DAY:-450}
      NAFTA2GO_API_TOKEN: ${NAFTA2GO_API_TOKEN:-}
      NAFTA2GO_ADMIN_TOKEN: ${NAFTA2GO_ADMIN_TOKEN:-}
      NAFTA2GO_PLACE_SEARCH_ENABLED: ${NAFTA2GO_PLACE_SEARCH_ENABLED-1}
    volumes:
      - nafta2go-data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.13.5
    profiles: [observabilidad]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=256MB"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets: [api_admin_token]
    depends_on: [api, cadvisor]

  grafana:
    image: grafana/grafana:13.3.1
    profiles: [observabilidad]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SMTP_ENABLED: "false"
    secrets: [grafana_admin_password]
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]

  cadvisor:
    image: ghcr.io/google/cadvisor:0.61.1
    profiles: [observabilidad]
    privileged: true
    command: ["--docker_only=true", "--housekeeping_interval=15s", "--store_container_labels=false", "--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro

secrets:
  api_admin_token:
    file: ${NAFTA2GO_METRICS_TOKEN_FILE:-./data/private/observability/api_admin_token}
  grafana_admin_password:
    file: ${NAFTA2GO_GRAFANA_PASSWORD_FILE:-./data/private/observability/grafana_admin_password}

volumes:
  nafta2go-data:
  prometheus-data:
  grafana-data:
