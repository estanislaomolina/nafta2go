global:
  scrape_interval: 15s
scrape_configs:
  - job_name: nafta2go
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/api_admin_token
    static_configs:
      - targets: [api:8000]
  - job_name: cadvisor
    static_configs:
      - targets: [cadvisor:8080]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_service]
        regex: api
        action: keep
      - source_labels: [__name__]
        regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes
        action: keep
