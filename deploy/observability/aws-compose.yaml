services:
  prometheus:
    image: prom/prometheus:v3.13.5
    network_mode: host
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.listen-address=127.0.0.1:9090", "--storage.tsdb.retention.time=7d", "--storage.tsdb.retention.size=256MB"]
    volumes:
      - ./prometheus-aws.yml:/etc/prometheus/prometheus.yml:ro
      - ${NAFTA2GO_PRIVATE_DIR}/api_admin_token:/run/secrets/api_admin_token:ro
      - prometheus-data:/prometheus
  grafana:
    image: grafana/grafana:13.3.1
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_ROOT_URL: https://${NAFTA2GO_PUBLIC_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SMTP_ENABLED: "false"
    volumes:
      - ${NAFTA2GO_PRIVATE_DIR}/grafana_admin_password:/run/secrets/grafana_admin_password:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./prometheus-aws-datasource.yaml:/etc/grafana/provisioning/datasources/prometheus.yaml:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
  cadvisor:
    image: ghcr.io/google/cadvisor:0.61.1
    network_mode: host
    restart: unless-stopped
    privileged: true
    command: ["--listen_ip=127.0.0.1", "--docker_only=true", "--housekeeping_interval=30s", "--store_container_labels=false", "--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
volumes:
  prometheus-data:
  grafana-data:
