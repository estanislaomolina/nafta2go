name: CI

on:
  push:
    branches: [main, dev]
    tags: ["entrega-*"]
  pull_request:
    branches: [main, dev]

# Cancelar PRs y dev obsoletos; no interrumpir un despliegue de main/entrega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' }}

permissions:
  contents: read

# Los nombres de los jobs son los checks requeridos del ruleset de dev y main:
# renombrarlos exige actualizar el ruleset (ver docs/CALIDAD.md).
jobs:
  docs:
    name: Docs y notebooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links relativos en Markdown
        run: python .github/scripts/check_links.py
      - name: Notebooks válidas
        run: |
          pip install nbformat
          python -c "
          import nbformat, pathlib, sys
          nbs = list(pathlib.Path('.').rglob('*.ipynb'))
          for nb in nbs:
              nbformat.validate(nbformat.read(nb, as_version=4))
              print('OK', nb)
          "

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Validar plantillas CloudFormation sin crear recursos
        run: cfn-lint -r us-east-2 -t infra/aws/*.json
      - name: Validar unidades de ingesta y monitor
        run: systemd-analyze verify deploy/nafta2go-*.service deploy/nafta2go-*.timer

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Correr pytest
        run: >-
          pytest -v --strict-markers --cov=nafta2go
          --cov-report=term-missing --cov-precision=2 --cov-fail-under=90

  secrets:
    name: Secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    name: Contenedores
    runs-on: ubuntu-latest
    env:
      NAFTA2GO_IMAGE: ghcr.io/estanislaomolina/nafta2go:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar configuración externa de caché y cupo
        env:
          ORS_CACHE_TTL_SECONDS: "19"
          ORS_CACHE_MAX_ENTRIES: "17"
          ORS_REQUESTS_PER_MINUTE: "2"
          ORS_REQUESTS_PER_DAY: "9"
          NAFTA2GO_MAX_PRICE_AGE_DAYS: "14"
        run: |
          docker compose --profile mvp --profile poc config --format json > compose-config.json
          python -c "import json, os; services=json.load(open('compose-config.json'))['services']; names=('ORS_CACHE_TTL_SECONDS','ORS_CACHE_MAX_ENTRIES','ORS_REQUESTS_PER_MINUTE','ORS_REQUESTS_PER_DAY','NAFTA2GO_MAX_PRICE_AGE_DAYS'); assert all(services[s]['environment'][k] == os.environ[k] for s in ('api','query') for k in names)"
          NAFTA2GO_MAX_PRICE_AGE_DAYS='' docker compose --profile mvp --profile poc config --format json > empty-policy.json
          python -c "import json; services=json.load(open('empty-policy.json'))['services']; assert all(services[s]['environment']['NAFTA2GO_MAX_PRICE_AGE_DAYS'] == '' for s in ('api','query'))"
      - name: Construir la imagen
        run: >-
          docker build
          --label org.opencontainers.image.revision=${{ github.sha }}
          --label org.opencontainers.image.source=https://github.com/estanislaomolina/nafta2go
          --tag "$NAFTA2GO_IMAGE" .
      - name: Migrar la base dentro del contenedor
        run: docker compose run --rm migrate
      - name: Verificar que el esquema quedó en la última versión
        run: docker compose run --rm migrate alembic current | tee current.txt && grep -q "(head)" current.txt
      - name: Reproducir la consulta completa sin red ni credenciales
        run: >-
          docker compose run --rm query
          --origin=-34.6037,-58.3816 --destination=-34.5627,-58.4565
          --matrix-file docs/evidencia/poc-05-flujo-2026-10-26/matrix.json
          --json > query.json && python -c
          "import json; r=json.load(open('query.json')); assert r['status']=='historical_scenario';
          assert r['outcome']=='recommended'; assert len(r['evaluations'])==10;
          assert r['recommendation_id'] is not None; assert r['routes']['replayed']"
      - name: Verificar readiness de la API dentro del contenedor
        env:
          NAFTA2GO_API_TOKEN: token-descartable-del-job-ci
        run: docker compose --profile mvp up --no-build --wait --wait-timeout 30 api
      - name: Verificar el snapshot Docker aislado sin APIs externas
        run: python tests/integration/compose_smoke.py --image "$NAFTA2GO_IMAGE"
      - name: Conservar exactamente la imagen verificada
        run: docker save "$NAFTA2GO_IMAGE" -o /tmp/nafta2go-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: imagen-verificada
          path: /tmp/nafta2go-image.tar
          retention-days: 1
      - name: Bajar servicios y volúmenes
        if: always()
        run: docker compose --profile mvp down --volumes

  publish:
    name: Publicar imagen verificada
    needs: [docs, lint, tests, secrets, containers, web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      NAFTA2GO_IMAGE: ghcr.io/estanislaomolina/nafta2go:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: imagen-verificada
          path: /tmp
      - name: Cargar la imagen probada, sin reconstruir
        run: docker load -i /tmp/nafta2go-image.tar
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar y verificar el digest y la revisión
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          docker push "$NAFTA2GO_IMAGE"
          image_id=$(docker image inspect "$NAFTA2GO_IMAGE" --format '{{.Id}}')
          digest_ref=$(docker image inspect "$NAFTA2GO_IMAGE" --format '{{index .RepoDigests 0}}')
          [[ "$digest_ref" =~ ^ghcr.io/estanislaomolina/nafta2go@sha256:[0-9a-f]{64}$ ]]
          docker pull "$digest_ref"
          test "$image_id" = "$(docker image inspect "$digest_ref" --format '{{.Id}}')"
          test "$RELEASE_COMMIT" = "$(docker image inspect "$digest_ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          printf '%s\n' "$digest_ref" > /tmp/image-digest.txt
          printf 'Imagen verificada: `%s`\n' "$digest_ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: referencia-imagen
          path: /tmp/image-digest.txt
          retention-days: 90

  web:
    name: Web y accesibilidad
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Instalar dependencias de QA
        run: python -m pip install -r requirements.txt && npm ci --prefix tests/browser --ignore-scripts
      # ubuntu-24.04 ya trae las bibliotecas del navegador. Las pruebas validan
      # el arranque real; no instalar fuentes de otros idiomas ni actualizar Mesa.
      - name: Instalar Chromium
        run: tests/browser/node_modules/.bin/playwright install --only-shell chromium
      - name: Probar flujos, teclado y accesibilidad sin APIs externas
        run: npm test --prefix tests/browser
      - name: Conservar reportes y capturas de QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-qa
          path: /tmp/nafta2go-web-artifacts
          retention-days: 7

  deploy:
    name: Desplegar demo
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/entrega-'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: demo
    concurrency:
      group: demo
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEMO_INSTANCE_ID: ${{ vars.DEMO_INSTANCE_ID }}
      RUNTIME_PARAMETER: ${{ vars.DEMO_RUNTIME_PARAMETER }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: referencia-imagen
          path: /tmp/release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEMO_ROLE_ARN }}
          aws-region: us-east-2
      - name: Encender la demo y esperar SSM
        run: |
          aws ec2 start-instances --instance-ids "$DEMO_INSTANCE_ID" > /dev/null
          aws ec2 wait instance-status-ok --instance-ids "$DEMO_INSTANCE_ID"
          for attempt in {1..30}; do
            ping=$(aws ssm describe-instance-information --filters "Key=InstanceIds,Values=$DEMO_INSTANCE_ID" --query 'InstanceInformationList[0].PingStatus' --output text)
            if [[ "$ping" == Online ]]; then exit 0; fi
            sleep 10
          done
          echo 'SSM no quedó disponible' >&2
          exit 1
      - name: Desplegar el digest probado y esperar smoke o recuperación
        run: |
          digest=$(cat /tmp/release/image-digest.txt)
          command_id=$(python scripts/aws_demo_command.py --instance-id "$DEMO_INSTANCE_ID" --commit "$RELEASE_COMMIT" --parameter "$RUNTIME_PARAMETER" --image "$digest")
          python scripts/aws_demo_wait.py --instance-id "$DEMO_INSTANCE_ID" --command-id "$command_id"
