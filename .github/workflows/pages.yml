name: Publicar la web en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
      - name: Construir sólo los archivos públicos
        env:
          API_ORIGIN: ${{ vars.NAFTA2GO_PUBLIC_API_ORIGIN }}
        run: python scripts/build_pages.py --output /tmp/nafta2go-pages --api-origin "$API_ORIGIN"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/nafta2go-pages
      - uses: actions/deploy-pages@v4
        id: deployment
